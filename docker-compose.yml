version: '3.8'

services:
  # ─── MongoDB ───────────────────────────────
  mongo:
    image: mongo:7
    container_name: smart-leads-mongo
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongo_data:/data/db
    networks:
      - smart-leads-net

  # ─── Backend API ───────────────────────────
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: smart-leads-server
    restart: unless-stopped
    ports:
      - '5000:5000'
    environment:
      - PORT=5000
      - NODE_ENV=development
      - MONGO_URI=mongodb://mongo:27017/smart_leads
      - JWT_SECRET=your_super_secret_jwt_key_change_this
      - JWT_EXPIRES_IN=7d
      - CORS_ORIGIN=http://localhost:5173
      - LOG_LEVEL=debug
    depends_on:
      - mongo
    networks:
      - smart-leads-net

  # ─── Frontend Client ──────────────────────
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: smart-leads-client
    restart: unless-stopped
    ports:
      - '3000:80'
    depends_on:
      - server
    networks:
      - smart-leads-net

volumes:
  mongo_data:

networks:
  smart-leads-net:
    driver: bridge
